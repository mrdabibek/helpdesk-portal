<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yordam — ekranlar ko‘rigi</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:Manrope,sans-serif;color:#25352e;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;background:#fff;border-bottom:1px solid #e4e8e2;display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:23px;margin:0}p{font-size:12px;color:#66736c;margin:6px 0}a{color:#17634d}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 105px)}nav{background:white;padding:20px;border-right:1px solid #e4e8e2;height:calc(100vh - 105px);overflow:auto;position:sticky;top:0}nav button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:7px;background:transparent;color:#53665b;font:600 12px Manrope;cursor:pointer;margin-bottom:4px}nav button.active{background:#e9f3ed;color:#17634d}section{padding:28px 36px;min-width:0}section h2{margin:0 0 20px;font-size:18px}.stage{background:#e9ede7;padding:25px;border-radius:14px;overflow:auto;text-align:center}#screen>svg{display:block;width:100%;height:auto;max-width:1440px;margin:auto;background:#fff;box-shadow:0 8px 30px #25352e10}#screen.mobile>svg{max-width:390px}small{font-size:11px;color:#66736c;display:block;margin-top:14px}.filter{display:flex;gap:8px;margin-bottom:16px}.filter button{font:600 12px Manrope;padding:8px 10px;border:1px solid #e4e8e2;border-radius:6px;background:#fff;cursor:pointer}.filter button.active{background:#17634d;color:white}@media(max-width:760px){main{grid-template-columns:1fr}nav{display:flex;overflow:auto;gap:8px;border:0;height:auto;position:static}nav button{min-width:150px}section{padding:18px}header{padding:20px}h1{font-size:18px}.stage{padding:10px}}</style></head><body><header><div><h1>yordam. / Ekranlar ko‘rigi</h1><p>Sayt dizayni asosidagi 22 ta ekran: agent, mijoz va kirish holatlari.</p></div><a href="/">Portalga kirish →</a></header><main><nav id="nav" aria-label="Ekranlar"></nav><section><div class="filter"><button data-group="all" class="active">Hammasi</button><button data-group="A">Agent</button><button data-group="M">Mijoz</button><button data-group="S">Kirish</button></div><h2 id="title"></h2><div class="stage"><div id="screen" role="img" aria-label="Ekran ko‘rigi"></div></div><small>Interfeysning dizayn ko‘rigi. Hisob va murojaatlar bilan ishlash uchun portalga kiring.</small></section></main><script>
const screens=[{"key": "A-01", "title": "Bosh sahifa"}, {"key": "A-02", "title": "Murojaatlar navbati"}, {"key": "A-03", "title": "Javobsiz murojaatlar"}, {"key": "A-04", "title": "Murojaat tafsilotlari"}, {"key": "A-05", "title": "Ichki izoh"}, {"key": "A-06", "title": "Javobni tekshirish"}, {"key": "A-07", "title": "Jamoa"}, {"key": "A-08", "title": "Hisobotlar"}, {"key": "A-09", "title": "SLA qoidalari"}, {"key": "M-01", "title": "Mijoz bosh sahifasi"}, {"key": "M-02", "title": "Mening murojaatlarim"}, {"key": "M-03", "title": "Yangi murojaat"}, {"key": "M-04", "title": "Murojaat qabul qilindi"}, {"key": "M-05", "title": "Yozishmalar tarixi"}, {"key": "M-06", "title": "Yechimni tasdiqlash"}, {"key": "M-07", "title": "Muammoni qayta ochish"}, {"key": "M-08", "title": "Bildirishnomalar"}, {"key": "M-09", "title": "Bilimlar bazasi"}, {"key": "M-10", "title": "Yordam maqolasi"}, {"key": "S-01", "title": "Tizimga kirish"}, {"key": "S-02", "title": "Yangi hisob yaratish"}, {"key": "S-03", "title": "Kirishda xatolik"}];let current=screens[0].key,group='all';const nav=document.getElementById('nav');function show(key){current=key;const s=screens.find(s=>s.key===key);document.getElementById('title').textContent=s.key+' · '+s.title;const preview=document.getElementById('screen');preview.setAttribute('aria-label',s.title);preview.setAttribute('aria-busy','true');preview.removeAttribute('data-loaded');preview.className=s.key.startsWith('M')?'mobile':'';fetch('/figma_assets/screens/'+key+'.svg').then(r=>{if(!r.ok)throw Error('Ekran ochilmadi');return r.text()}).then(text=>{if(current!==key)return;const svg=new DOMParser().parseFromString(text,'image/svg+xml').documentElement;if(svg.localName!=='svg')throw Error('Ekran formati noto‘g‘ri');svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());[svg,...svg.querySelectorAll('*')].forEach(n=>{for(const a of [...n.attributes])if(/^on/i.test(a.name)||((a.localName==='href')&&!a.value.startsWith('#')))n.removeAttribute(a.name)});preview.replaceChildren(document.importNode(svg,true));preview.dataset.loaded=key;preview.setAttribute('aria-busy','false')}).catch(()=>{if(current===key){preview.textContent='Ekranni ochib bo‘lmadi. Boshqa ekran tanlang yoki sahifani yangilang.';preview.setAttribute('aria-busy','false')}});document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.key===key);b.setAttribute('aria-current',b.dataset.key===key?'page':'false')});history.replaceState(null,'','#'+key);}function list(){nav.replaceChildren();screens.filter(s=>group==='all'||s.key.startsWith(group)).forEach(s=>{const b=document.createElement('button');b.textContent=s.key+' · '+s.title;b.dataset.key=s.key;b.onclick=()=>show(s.key);nav.append(b)});show(screens.filter(s=>group==='all'||s.key.startsWith(group)).some(s=>s.key===current)?current:screens.find(s=>s.key.startsWith(group)||group==='all').key)}document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;document.querySelectorAll('[data-group]').forEach(t=>t.classList.toggle('active',t===b));list()});if(screens.some(s=>s.key===location.hash.slice(1)))current=location.hash.slice(1);list();
</script></body></html>
