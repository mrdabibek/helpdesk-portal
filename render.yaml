services:
  - type: web
    name: yordam-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
