ni tekshiring.</text><text x="21" y="428.92" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="rgb(37, 53, 46)" letter-spacing="-0.35px">Amallar ketma-ketligi</text><text x="41" y="464.44" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="rgb(37, 53, 46)">To‘lov ilovasida tranzaksiya muvaffaqiyatli bajarilganini</text><text x="41" y="488.44" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="rgb(37, 53, 46)">tekshiring.</text><text x="41" y="512.44" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="rgb(37, 53, 46)">Shaxsiy kabinet sahifasini yangilang.</text><text x="41" y="536.44" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="rgb(37, 53, 46)">Muammo qolsa, yangi murojaatga to‘lov cheki va vaqtini</text><text x="41" y="560.44" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="rgb(37, 53, 46)">biriktiring.</text><rect x="21" y="593" width="348.4" height="148.2" rx="0" fill="none" stroke="rgb(228, 232, 226)" stroke-width="0.8"/><text x="21" y="628.48" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="rgb(37, 53, 46)">Javob yordam bermadimi?</text><text x="21" y="667.64" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="rgb(92, 109, 96)">Muammoni batafsil yozing. Jamoamiz sizga yordam beradi.</text><rect x="21" y="693.2" width="162.84" height="48" rx="8" fill="rgb(23, 99, 77)"/><rect x="21" y="693.2" width="162.84" height="48" rx="8" fill="none" stroke="rgb(23, 99, 77)" stroke-width="0.8"/><svg x="37.8" y="707.7" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="rgb(255, 255, 255)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg><text x="64.8" y="720.64" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="r